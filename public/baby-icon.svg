<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 부드러운 핑크빛 배경 -->
  <rect width="100" height="100" rx="24" fill="#fff1f2"/>
  
  <!-- 동양적인 따뜻한 피부톤의 얼굴 -->
  <circle cx="50" cy="58" r="26" fill="#ffe0bd"/>
  
  <!-- 까만 바가지 앞머리 -->
  <path d="M 24 58 C 24 25, 76 25, 76 58 C 76 45, 65 40, 50 40 C 35 40, 24 45, 24 58 Z" fill="#2d3748"/>
  
  <!-- 뿅 솟아오른 귀여운 새싹 머리털 -->
  <path d="M 48 33 Q 45 20 55 22 Q 52 28 52 33 Z" fill="#2d3748"/>
  
  <!-- 방긋 웃는 눈 -->
  <path d="M 36 60 Q 40 56 44 60" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 56 60 Q 60 56 64 60" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 발그레한 핑크빛 볼 -->
  <ellipse cx="34" cy="65" rx="4" ry="2.5" fill="#ffb3c6" opacity="0.8"/>
  <ellipse cx="66" cy="65" rx="4" ry="2.5" fill="#ffb3c6" opacity="0.8"/>
  
  <!-- 앙증맞은 입술 -->
  <path d="M 47 68 Q 50 71 53 68" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
</svg>
